# Scanner web app. Phones only grant the camera in a secure context (HTTPS or localhost),
# so this config serves HTTPS on 8443 and a short HTTP hint on 8080.

# HTTPS — map host SCANNER_PORT (default 8091) here.
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2100m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /health/ {
        proxy_pass http://api:8080;
    }

    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
    }
}

# Plain HTTP — phones will not get a camera prompt here. Point people to HTTPS.
server {
    listen 8080;
    server_name _;
    default_type text/html;
    charset utf-8;

    location / {
        return 200 '<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>اسکنر اسناد</title><style>body{font-family:Tahoma,sans-serif;margin:2rem;line-height:1.8;color:#222}code{background:#f3f3f3;padding:.1rem .35rem}</style></head><body><h1>دوربین فقط روی HTTPS</h1><p>مرورگر گوشی روی آدرس <code>http://</code> اجازهٔ دوربین نمی‌دهد. صفحه را با <strong>https://</strong> باز کنید (همان آی‌پی و پورت HTTPS، معمولاً <code>8091</code>).</p><p>مثال: <code>https://62.60.166.71:8091</code></p><p>اولین بار هشدار گواهی را بپذیرید (Advanced / جزئیات ← ادامه)، بعد اجازهٔ دوربین را تأیید کنید. برای نصب بدون مرورگر از APK صفحهٔ ورود بایگانی استفاده کنید.</p></body></html>';
    }
}
