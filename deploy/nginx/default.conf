# Serves the single-page app and forwards the API. Uploads are streamed straight through to the
# API (no request buffering), which enforces the real size limit itself.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2100m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://api:8080;
    }

    # Hashed build assets can be cached forever; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Client-side routes (/documents/..., /tasks) all load the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
    }
}
