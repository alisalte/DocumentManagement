# Serves the single-page app and forwards the API. Uploads are streamed straight through to the
# API (no request buffering), which enforces the real size limit itself.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2100m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        proxy_pass http://api:8080;
    }

    # Sideload APK copied onto the scanner-apk volume. Exact match so it is not the SPA.
    location = /downloads/dms-scanner.apk {
        alias /usr/share/nginx/html/downloads/dms-scanner.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Type "application/vnd.android.package-archive" always;
        add_header Content-Disposition "attachment; filename=\"dms-scanner.apk\"" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build assets can be cached forever; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Client-side routes (/documents/..., /tasks) all load the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
    }
}
